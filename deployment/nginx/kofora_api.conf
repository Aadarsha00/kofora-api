server {
    listen 80;
    server_name api.kofora.com;

    # Hero background videos are uploaded through the admin, so this has to
    # clear a short 1080p clip, not just a product photo.
    client_max_body_size 200M;

    location /static/ {
        alias /var/www/kofora/backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/kofora/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
