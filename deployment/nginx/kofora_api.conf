server {
    listen 80;
    listen [::]:80;
    server_name api.kofora.com;

    return 301 https://api.kofora.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kofora.com;

    ssl_certificate /etc/letsencrypt/live/www.kofora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.kofora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hero background videos are uploaded through the admin, so this has to
    # clear a short 1080p clip, not just a product photo.
    client_max_body_size 200M;

    location /static/ {
        alias /var/www/kofora/backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/kofora/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
