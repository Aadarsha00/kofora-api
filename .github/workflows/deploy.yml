name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          # SQLite + in-memory cache/broker, same as local dev - no Postgres or
          # Redis service needed for the test suite to run.
          DJANGO_SETTINGS_MODULE: kofora_backend.settings.development
        run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_DEPLOY_PATH }}"
            VENV_DIR="$(dirname "$APP_DIR")/venv"

            cd "$APP_DIR"
            git pull origin main

            if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv "$VENV_DIR"
            fi

            "$VENV_DIR/bin/pip" install --upgrade pip
            "$VENV_DIR/bin/pip" install -r requirements.txt

            export DJANGO_SETTINGS_MODULE=kofora_backend.settings.production
            "$VENV_DIR/bin/python" manage.py migrate --noinput
            "$VENV_DIR/bin/python" manage.py collectstatic --noinput

            sudo systemctl restart kofora-gunicorn
            sudo systemctl restart kofora-celery-worker
            sudo systemctl restart kofora-celery-beat
            sudo systemctl reload nginx
