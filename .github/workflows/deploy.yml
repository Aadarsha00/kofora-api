name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          # SQLite + in-memory cache/broker, same as local dev - no Postgres or
          # Redis service needed for the test suite to run.
          DJANGO_SETTINGS_MODULE: kofora_backend.settings.development
        run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/apps/backend
            git pull origin main
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose up -d --build backend celery_worker celery_beat
            docker image prune -f
